name: CI

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
          - '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            vendor
          key: vendor-${{ runner.os }}-p${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            vendor-${{ runner.os }}-p${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit -c tests/phpunit.xml.dist

      - name: Lint shell scripts
        run: |
          shellcheck Resources/Testing/Scripts/*.sh
          php -l bin/qa
          php -l src/Console/Application.php
          php -l Resources/Testing/renderPhpunitXml.php
          for fixer in src/PhpCsFixer/Fixer/*.php; do php -l "$fixer"; done

      - name: Run script tests
        run: sh Resources/Testing/Scripts/checkReleaseTagTest.sh

      - name: Validate workflow YAML
        # extension-ci.yml is the single source of truth for every
        # extension pipeline - a syntax break there would turn all of
        # them red, so the workflow files are parse-checked here.
        run: |
          for f in .github/workflows/*.yml; do
            python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))' "$f"
          done

  lint:
    # The package is linted with the very tooling it ships to the
    # extension repositories: PHPStan with the shared baseline
    # (phpstan.neon.dist includes Resources/Quality/phpstan.neon),
    # php-cs-fixer with the shared CGL configuration (.php-cs-fixer.php
    # calls CsFixerFactory) and composer normalize.
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            vendor
          key: vendor-${{ runner.os }}-p8.4-${{ hashFiles('composer.json') }}
          restore-keys: |
            vendor-${{ runner.os }}-p8.4-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Lint
        run: |
          composer analyze:php
          composer lint:composer
          composer lint:php
